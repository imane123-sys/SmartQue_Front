services:
  frontend:
    build: .
    ports:
      - "5173:80"
    networks:
      - smartqueue-network

  smartqueue:
    build: C:/Users/RM/IdeaProjects/SmartQueue_Backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartqueue
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - smartqueue-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartqueue
    ports:
      - "3307:3306"
    networks:
      - smartqueue-network

networks:
  smartqueue-network:
    driver: bridge
